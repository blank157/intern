# AI Provider Configuration
ai_provider: "ollama"

# Active model profile (overridden by MODEL_PROFILE or VISION_MODEL env vars)
active_model_profile: "qwen3_vl_4b"

# Ollama OpenAI-compatible server defaults
ollama:
  base_url: "http://localhost:11434/v1"
  model: "qwen3-vl:4b"
  api_key: "ollama"
  timeout_seconds: 120
  max_retries: 2

# Logging
log_level: "INFO"
log_inference_timing: true
log_memory_snapshots: true

# Safety
vram_safety_margin_gb: 1.5
max_oom_retries: 3
oom_resolution_tiers: [1048576, 589824, 262144, 147456]  # 1024², 768², 512², 384²

# Paths (relative to project root)
models_dir: "models"
prompts_dir: "src/answer_eval/prompts/templates"
data_dir: "data"
cache_dir: "cache"
benchmarks_dir: "benchmarks"

# Structured output
structured_output:
  max_repair_retries: 2
  validate_json_schema: true

# Cache
cache:
  enabled: true
  backend: "filesystem"
