[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answer-paper-eval"
version = "0.1.0"
description = "AI-powered answer sheet evaluation system with multi-model, multi-hardware support"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "structlog>=24.0",
]

[project.optional-dependencies]
gpu-detect = [
    "pynvml>=11.5",
]
benchmark = [
    "jiwer>=3.0",
    "rapidfuzz>=3.0",
]
vllm-client = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "answer-paper-eval[gpu-detect,benchmark,vllm-client,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/answer_eval"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: tests requiring GPU",
    "model: tests requiring model files",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
